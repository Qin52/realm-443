{% extends "base.html" %}
{% block title %}运行日志 - {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head">
  <div class="grow">
    <h1 class="page-title">运行日志</h1>
    <p class="page-desc">排查连接失败时，优先查看 GOST 与本地中继日志。</p>
  </div>
  <div class="page-actions">
    <a class="btn btn-ghost" href="{{ url_for('dashboard') }}">返回控制台</a>
  </div>
</div>

<section class="grid-2 even">
  <div class="card">
    <div class="card-head"><div><span class="kicker">gost.service</span><h2 class="card-title">GOST</h2></div></div>
    <pre class="code-block">{{ gost_logs }}</pre>
  </div>
  <div class="card">
    <div class="card-head"><div><span class="kicker">gsm-relay.service</span><h2 class="card-title">本地中继</h2></div></div>
    <pre class="code-block">{{ relay_logs }}</pre>
  </div>
</section>

<section class="card">
  <div class="card-head"><div><span class="kicker">caddy.service</span><h2 class="card-title">Caddy</h2></div></div>
  <pre class="code-block">{{ caddy_logs }}</pre>
</section>
{% endblock %}
