{% extends "base.html" %}
{% block title %}登录 - {{ app_name }}{% endblock %}
{% block content %}
<section class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="logo">G</span>
      <div class="brand-text">
        <strong>{{ app_name }}</strong>
        <em>SNI 转发管理面板</em>
      </div>
    </div>
    <h1>登录面板</h1>
    <p class="lead">使用安装时生成的账号，或由主账号创建的拼车账号登录。</p>
    <form method="post" action="{{ url_for('login_submit') }}">
      <label class="field">
        <span>用户名</span>
        <input name="username" autocomplete="username" required autofocus placeholder="gsm_xxxxxxxx">
      </label>
      <label class="field">
        <span>密码</span>
        <input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码">
      </label>
      <button class="btn btn-primary btn-block" type="submit">登录</button>
    </form>
    <p class="login-foot">GOST 按 TLS SNI 分流，未命中规则时回落到 Caddy。</p>
  </div>
</section>
{% endblock %}
